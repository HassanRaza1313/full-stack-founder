name: Idea
description: A product or feature idea to test
labels: ["type:idea", "status:new"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the pain, and what is it?
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
      description: "We believe <change> will cause <outcome> for <who>."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to feedback, analytics, research or competitors.
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [customer feedback, analytics, team, competitor, discovery]
    validations:
      required: true
  - type: input
    id: metric
    attributes:
      label: Success metric
      description: The number that tells us it worked.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Rough size
      options: [S, M, L]
